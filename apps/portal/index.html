<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PORTAL — Digital Operations System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tailwind.min.css">
  <link rel="stylesheet" href="./css/app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased select-none font-sans">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-md shadow-red-200">
          <i data-lucide="layers" class="h-5 w-5"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-slate-900 leading-tight tracking-wider">PORTAL</h1>
          <p class="text-xs font-medium text-slate-400">Digital Operations System</p>
        </div>
      </div>

      <!-- ACTIONS: AUDIO & LOGOUT -->
      <div class="flex items-center space-x-2">
        <button id="btnToggleAudio" type="button" class="h-10 w-10 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 flex items-center justify-center text-slate-600 transition" title="Beralih Suara Beep" aria-label="Toggle Audio">
          <i id="audioIcon" data-lucide="volume-2" class="h-4 w-4"></i>
        </button>

        <button id="btnLogout" type="button" class="hidden h-10 px-3.5 rounded-xl bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 text-xs font-bold flex items-center space-x-1.5 transition active:scale-95">
          <i data-lucide="log-out" class="h-3.5 w-3.5"></i>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center">

    <!-- 1. LOGIN VIEW -->
    <div id="loginView" class="w-full">
      <div class="rounded-3xl bg-white p-6 sm:p-8 shadow-sm ring-1 ring-slate-200">
        <div class="text-center mb-8">
          <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-red-600 text-white shadow-lg shadow-red-200">
            <i data-lucide="layers" class="h-8 w-8"></i>
          </div>
          <h2 class="text-2xl font-black text-slate-900 tracking-wider">PORTAL</h2>
          <p class="mt-2 text-sm text-slate-500">Digital Operations System</p>
        </div>

        <!-- ALERT -->
        <div id="loginAlert" class="hidden mb-4 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-start space-x-2">
          <i data-lucide="alert-circle" class="h-4 w-4 shrink-0 mt-0.5"></i>
          <span id="loginAlertText">Access ID tidak valid</span>
        </div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label for="accessIdInput" class="mb-2 block text-sm font-semibold text-slate-900">Access ID</label>
            <div class="relative">
              <i data-lucide="badge-user" class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>
              <input
                id="accessIdInput"
                type="text"
                inputmode="numeric"
                autocomplete="username"
                required
                placeholder="Masukkan Access ID"
                class="h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 pl-12 pr-4 text-base font-bold outline-none transition focus:border-red-500 focus:bg-white focus:ring-4 focus:ring-red-100 placeholder:text-sm placeholder:normal-case placeholder:font-normal placeholder:text-slate-400"
              />
            </div>
          </div>

          <button
            id="btnLoginSubmit"
            type="submit"
            class="mt-5 flex h-14 w-full items-center justify-center gap-2 rounded-2xl bg-red-600 font-bold text-white shadow-lg shadow-red-200 transition hover:bg-red-700 active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span id="btnLoginText">Masuk</span>
            <i data-lucide="arrow-right" class="h-5 w-5"></i>
            <div id="btnLoginSpinner" class="hidden h-5 w-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </button>
        </form>
      </div>
    </div>

    <!-- 2. APPS LAUNCHER VIEW (AUTHORIZED) -->
    <div id="portalView" class="hidden w-full space-y-5">

      <!-- USER INFO CARD -->
      <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 rounded-3xl p-5 sm:p-6 text-white shadow-xl shadow-slate-900/10">
        <div class="flex items-start justify-between">
          <div class="space-y-1">
            <span id="userRoleBadge" class="inline-block px-2.5 py-0.5 rounded-full bg-red-500/20 border border-red-500/30 text-[10px] font-bold tracking-wider text-red-400 uppercase">
              USER
            </span>
            <h2 id="userNameText" class="text-xl font-black text-white leading-tight">Nama Petugas</h2>
            <p class="text-xs text-slate-300 flex items-center space-x-1.5 pt-1">
              <span>ID: <strong id="userAccessIdText" class="text-white font-semibold">1001</strong></span>
              <span>•</span>
              <span id="userStoreText" class="text-slate-200">STR-001</span>
            </p>
          </div>
          <div class="h-11 w-11 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center text-red-400">
            <i data-lucide="user-check" class="h-6 w-6"></i>
          </div>
        </div>

        <!-- STORE SWITCHER (OPS & ADMIN ONLY) -->
        <div id="storeSwitcherContainer" class="hidden mt-4 pt-3 border-t border-white/10">
          <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Ganti Toko:</label>
          <div class="flex items-center space-x-2">
            <input
              id="activeStoreInput"
              type="text"
              placeholder="Kode Toko"
              class="flex-1 px-3.5 py-2 bg-white/10 border border-white/15 rounded-xl text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white/15 uppercase"
            />
            <button
              id="btnUpdateStore"
              type="button"
              class="px-4 py-2 bg-red-600 hover:bg-red-700 active:scale-95 text-xs font-bold text-white rounded-xl shadow-md shadow-red-900/30 transition-all"
            >
              Ubah
            </button>
          </div>
        </div>
      </div>

      <!-- SECTION TITLE -->
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pilih Menu</h3>
      </div>

      <!-- APPS GRID -->
      <div id="appsGrid" class="grid grid-cols-1 gap-3.5">

        <!-- CARD 1: STOCKFLOW WMS -->
        <a
          id="appCardStockflow"
          href="./stockflow/"
          class="group app-card bg-white hover:bg-red-50/20 rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-slate-200 hover:border-red-300 shadow-sm hover:shadow-md active:scale-[.99] transition-all flex items-center space-x-4 cursor-pointer"
        >
          <div class="h-12 w-12 sm:h-14 sm:w-14 rounded-2xl bg-red-600 text-white flex items-center justify-center shrink-0 shadow-md shadow-red-200 group-hover:scale-105 transition-transform">
            <i data-lucide="package-search" class="h-6 w-6 sm:h-7 sm:w-7"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center space-x-2">
              <h4 class="text-sm sm:text-base font-black text-slate-900 group-hover:text-red-600 transition-colors">StockFlow WMS</h4>
              <span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-bold text-emerald-700 ring-1 ring-emerald-200">Aktif</span>
            </div>
            <p class="text-xs text-slate-500 truncate mt-0.5">Manajemen stok dan mutasi rak.</p>
          </div>
          <i data-lucide="chevron-right" class="h-5 w-5 text-slate-400 group-hover:text-red-600 group-hover:translate-x-0.5 transition-all shrink-0"></i>
        </a>

        <!-- CARD 2: PACKING DOCUMENTATION -->
        <a
          id="appCardPacking"
          href="./packing/"
          class="group app-card bg-white hover:bg-red-50/20 rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-slate-200 hover:border-red-300 shadow-sm hover:shadow-md active:scale-[.99] transition-all flex items-center space-x-4 cursor-pointer"
        >
          <div class="h-12 w-12 sm:h-14 sm:w-14 rounded-2xl bg-red-600 text-white flex items-center justify-center shrink-0 shadow-md shadow-red-200 group-hover:scale-105 transition-transform">
            <i data-lucide="package-check" class="h-6 w-6 sm:h-7 sm:w-7"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center space-x-2">
              <h4 class="text-sm sm:text-base font-black text-slate-900 group-hover:text-red-600 transition-colors">Dokumentasi Packing</h4>
              <span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-bold text-emerald-700 ring-1 ring-emerald-200">Aktif</span>
            </div>
            <p class="text-xs text-slate-500 truncate mt-0.5">Dokumentasi foto paket pengiriman.</p>
          </div>
          <i data-lucide="chevron-right" class="h-5 w-5 text-slate-400 group-hover:text-red-600 group-hover:translate-x-0.5 transition-all shrink-0"></i>
        </a>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="py-4 text-center text-slate-400 text-xs">
    <span>Digital Operations System</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="../../packages/shared-auth/index.js" type="module"></script>
  <script src="../../packages/shared-core/audio.js" type="module"></script>
  <script src="./js/portal.js" type="module"></script>
</body>
</html>
