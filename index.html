<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Warehouse App</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c'
            }
          }
        }
      }
    };
  </script>

  <link
    rel="stylesheet"
    href="./css/app.css"
  >
</head>


<body class="bg-slate-50 text-slate-900 antialiased">


<!-- =========================================
     BOOT
========================================= -->

<section
  id="bootPage"
  class="
    fixed
    inset-0
    z-[200]
    flex
    items-center
    justify-center
    bg-slate-50
  "
>

  <div class="text-center">

    <div
      class="
        mx-auto
        flex
        h-16
        w-16
        items-center
        justify-center
        rounded-3xl
        bg-red-600
        text-white
        shadow-lg
        shadow-red-200
      "
    >
      <i
        data-lucide="package-search"
        class="h-8 w-8"
      ></i>
    </div>

    <div
      class="
        mx-auto
        mt-6
        h-6
        w-6
        animate-spin
        rounded-full
        border-2
        border-slate-200
        border-t-red-600
      "
    ></div>

    <p class="mt-4 text-sm font-semibold text-slate-500">
      Menyiapkan aplikasi...
    </p>

  </div>

</section>


<!-- =========================================
     LOGIN
========================================= -->

<section
  id="loginPage"
  class="
    hidden
    min-h-screen
    items-center
    justify-center
    p-5
  "
>

  <div class="w-full max-w-sm">

    <!-- BRAND -->

    <div class="mb-8 text-center">

      <div
        class="
          mx-auto
          mb-4
          flex
          h-16
          w-16
          items-center
          justify-center
          rounded-3xl
          bg-red-600
          text-white
          shadow-lg
          shadow-red-200
        "
      >
        <i
          data-lucide="package-search"
          class="h-8 w-8"
        ></i>
      </div>


      <h1 class="text-2xl font-black">
        Warehouse App
      </h1>


      <p class="mt-2 text-sm text-slate-500">
        Masukkan NIK untuk melanjutkan
      </p>

    </div>


    <!-- FORM -->

    <form
      id="loginForm"
      class="
        rounded-3xl
        bg-white
        p-6
        shadow-sm
        ring-1
        ring-slate-200
      "
    >

      <label
        for="nikInput"
        class="
          mb-2
          block
          text-sm
          font-semibold
        "
      >
        NIK
      </label>


      <div class="relative">

        <i
          data-lucide="badge-user"
          class="
            absolute
            left-4
            top-1/2
            h-5
            w-5
            -translate-y-1/2
            text-slate-400
          "
        ></i>

        <input
          id="nikInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Masukkan NIK"
          class="
            h-14
            w-full
            rounded-2xl
            border
            border-slate-200
            bg-slate-50
            pl-12
            pr-4
            text-lg
            font-bold
            outline-none
            transition
            focus:border-red-500
            focus:bg-white
            focus:ring-4
            focus:ring-red-100
          "
        >

      </div>


      <div
        id="loginError"
        class="
          mt-3
          hidden
          rounded-xl
          bg-red-50
          px-4
          py-3
          text-sm
          font-medium
          text-red-700
        "
      ></div>


      <button
        id="loginButton"
        type="submit"
        class="
          mt-5
          flex
          h-14
          w-full
          items-center
          justify-center
          gap-2
          rounded-2xl
          bg-red-600
          font-bold
          text-white
          shadow-sm
          transition
          active:scale-[.98]
          hover:bg-red-700
          disabled:cursor-not-allowed
          disabled:opacity-60
        "
      >

        <span>
          Masuk
        </span>

        <i
          data-lucide="arrow-right"
          class="h-5 w-5"
        ></i>

      </button>

    </form>

  </div>

</section>


<!-- =========================================
     APPLICATION
========================================= -->

<div
  id="appPage"
  class="hidden min-h-screen lg:flex"
>


  <!-- =====================================
       DESKTOP SIDEBAR
  ====================================== -->

  <aside
    class="
      hidden
      w-64
      shrink-0
      border-r
      border-slate-200
      bg-white
      lg:flex
      lg:flex-col
    "
  >

    <div
      class="
        flex
        h-20
        items-center
        gap-3
        border-b
        border-slate-100
        px-6
      "
    >

      <div
        class="
          flex
          h-10
          w-10
          items-center
          justify-center
          rounded-xl
          bg-red-600
          text-white
        "
      >
        <i
          data-lucide="package-search"
          class="h-5 w-5"
        ></i>
      </div>


      <div>

        <div class="font-black">
          Warehouse
        </div>

        <div class="text-xs text-slate-400">
          Inventory App
        </div>

      </div>

    </div>


    <nav class="flex-1 space-y-2 p-4">

      <button
        class="desktop-nav desktop-nav-active"
      >
        <i data-lucide="house"></i>
        Dashboard
      </button>


      <button
        class="desktop-nav desktop-nav-disabled"
        disabled
      >
        <i data-lucide="search"></i>
        Cari Barang
      </button>


      <button
        class="desktop-nav desktop-nav-disabled"
        disabled
      >
        <i data-lucide="package-plus"></i>
        Barang Masuk
      </button>


      <button
        class="desktop-nav desktop-nav-disabled"
        disabled
      >
        <i data-lucide="package-minus"></i>
        Barang Keluar
      </button>


      <button
        class="desktop-nav desktop-nav-disabled"
        disabled
      >
        <i data-lucide="move-right"></i>
        Pindah Barang
      </button>


      <button
        class="desktop-nav desktop-nav-disabled"
        disabled
      >
        <i data-lucide="history"></i>
        Riwayat
      </button>

    </nav>


    <div class="border-t border-slate-100 p-4">

      <button
        id="desktopLogoutButton"
        class="
          flex
          h-11
          w-full
          items-center
          gap-3
          rounded-xl
          px-3
          text-sm
          font-semibold
          text-slate-500
          transition
          hover:bg-slate-100
        "
      >
        <i
          data-lucide="log-out"
          class="h-5 w-5"
        ></i>

        Keluar
      </button>

    </div>

  </aside>


  <!-- =====================================
       MAIN
  ====================================== -->

  <main
    class="
      min-w-0
      flex-1
      pb-24
      lg:pb-0
    "
  >


    <!-- HEADER -->

    <header
      class="
        sticky
        top-0
        z-30
        border-b
        border-slate-200
        bg-white/95
        backdrop-blur
      "
    >

      <div
        class="
          mx-auto
          flex
          h-16
          max-w-5xl
          items-center
          justify-between
          px-4
          lg:h-20
          lg:px-8
        "
      >

        <div>

          <p
            class="
              text-xs
              font-medium
              text-slate-400
            "
          >
            Selamat bekerja
          </p>

          <h2
            id="headerUserName"
            class="font-black"
          >
            PIC
          </h2>

        </div>


        <button
          id="mobileLogoutButton"
          type="button"
          class="
            flex
            h-10
            w-10
            items-center
            justify-center
            rounded-xl
            bg-slate-100
            text-slate-500
            active:scale-95
            lg:hidden
          "
        >
          <i
            data-lucide="log-out"
            class="h-5 w-5"
          ></i>
        </button>

      </div>

    </header>


    <!-- DASHBOARD -->

    <section
      class="
        mx-auto
        max-w-5xl
        px-4
        py-5
        lg:px-8
        lg:py-8
      "
    >

      <!-- USER CARD -->

      <div
        class="
          overflow-hidden
          rounded-3xl
          bg-slate-900
          p-5
          text-white
          shadow-sm
          lg:p-7
        "
      >

        <div
          class="
            flex
            items-start
            justify-between
            gap-4
          "
        >

          <div>

            <p
              class="
                text-sm
                font-medium
                text-slate-400
              "
            >
              Login sebagai
            </p>


            <h1
              id="dashboardUserName"
              class="
                mt-1
                text-2xl
                font-black
                lg:text-3xl
              "
            >
              -
            </h1>


            <div
              class="
                mt-4
                flex
                flex-wrap
                gap-2
              "
            >

              <span
                id="dashboardNik"
                class="
                  rounded-full
                  bg-white/10
                  px-3
                  py-1.5
                  text-xs
                  font-bold
                "
              >
                NIK -
              </span>


              <span
                id="dashboardRole"
                class="
                  rounded-full
                  bg-red-600
                  px-3
                  py-1.5
                  text-xs
                  font-bold
                "
              >
                PIC
              </span>

            </div>

          </div>


          <div
            class="
              flex
              h-14
              w-14
              shrink-0
              items-center
              justify-center
              rounded-2xl
              bg-white/10
            "
          >
            <i
              data-lucide="user-round"
              class="h-7 w-7"
            ></i>
          </div>

        </div>

      </div>


      <!-- TITLE -->

      <div class="mb-4 mt-7">

        <h2
          class="
            text-lg
            font-black
            lg:text-xl
          "
        >
          Menu
        </h2>

        <p class="mt-1 text-sm text-slate-500">
          Fitur warehouse akan kita aktifkan bertahap.
        </p>

      </div>


      <!-- MENU CARDS -->

      <div
        class="
          grid
          grid-cols-2
          gap-3
          sm:grid-cols-3
          lg:grid-cols-4
        "
      >

        <!-- SEARCH -->

        <button
          type="button"
          disabled
          class="
            dashboard-menu
            opacity-50
          "
        >

          <div
            class="
              dashboard-menu-icon
              bg-red-50
              text-red-600
            "
          >
            <i data-lucide="search"></i>
          </div>

          <div class="mt-4">

            <h3 class="font-black">
              Cari Barang
            </h3>

            <p class="mt-1 text-xs text-slate-400">
              Tahap berikutnya
            </p>

          </div>

        </button>


        <!-- IN -->

        <button
          type="button"
          disabled
          class="
            dashboard-menu
            opacity-50
          "
        >

          <div
            class="
              dashboard-menu-icon
              bg-emerald-50
              text-emerald-600
            "
          >
            <i data-lucide="package-plus"></i>
          </div>

          <div class="mt-4">

            <h3 class="font-black">
              Barang Masuk
            </h3>

            <p class="mt-1 text-xs text-slate-400">
              Segera
            </p>

          </div>

        </button>


        <!-- OUT -->

        <button
          type="button"
          disabled
          class="
            dashboard-menu
            opacity-50
          "
        >

          <div
            class="
              dashboard-menu-icon
              bg-orange-50
              text-orange-600
            "
          >
            <i data-lucide="package-minus"></i>
          </div>

          <div class="mt-4">

            <h3 class="font-black">
              Barang Keluar
            </h3>

            <p class="mt-1 text-xs text-slate-400">
              Segera
            </p>

          </div>

        </button>


        <!-- MOVE -->

        <button
          type="button"
          disabled
          class="
            dashboard-menu
            opacity-50
          "
        >

          <div
            class="
              dashboard-menu-icon
              bg-blue-50
              text-blue-600
            "
          >
            <i data-lucide="move-right"></i>
          </div>

          <div class="mt-4">

            <h3 class="font-black">
              Pindah
            </h3>

            <p class="mt-1 text-xs text-slate-400">
              Segera
            </p>

          </div>

        </button>

      </div>


      <!-- STATUS -->

      <div
        class="
          mt-7
          rounded-2xl
          border
          border-emerald-200
          bg-emerald-50
          p-4
        "
      >

        <div class="flex gap-3">

          <div
            class="
              flex
              h-10
              w-10
              shrink-0
              items-center
              justify-center
              rounded-xl
              bg-emerald-100
              text-emerald-600
            "
          >
            <i
              data-lucide="circle-check"
              class="h-5 w-5"
            ></i>
          </div>


          <div>

            <h3
              class="
                text-sm
                font-black
                text-emerald-900
              "
            >
              Login berhasil
            </h3>

            <p
              class="
                mt-1
                text-xs
                leading-5
                text-emerald-700
              "
            >
              Frontend GitHub Pages sudah terhubung
              dengan backend n8n.
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================
       MOBILE BOTTOM NAV
  ====================================== -->

  <nav
    class="
      mobile-bottom-nav
      fixed
      bottom-0
      left-0
      right-0
      z-40
      border-t
      border-slate-200
      bg-white
      lg:hidden
    "
  >

    <div class="grid grid-cols-5">

      <button
        class="
          mobile-nav
          mobile-nav-active
        "
      >
        <i data-lucide="house"></i>
        <span>Home</span>
      </button>


      <button
        disabled
        class="
          mobile-nav
          opacity-40
        "
      >
        <i data-lucide="search"></i>
        <span>Cari</span>
      </button>


      <button
        disabled
        class="
          mobile-nav
          opacity-40
        "
      >
        <i data-lucide="package-plus"></i>
        <span>Masuk</span>
      </button>


      <button
        disabled
        class="
          mobile-nav
          opacity-40
        "
      >
        <i data-lucide="package-minus"></i>
        <span>Keluar</span>
      </button>


      <button
        disabled
        class="
          mobile-nav
          opacity-40
        "
      >
        <i data-lucide="history"></i>
        <span>History</span>
      </button>

    </div>

  </nav>

</div>


<!-- =========================================
     TOAST
========================================= -->

<div
  id="toast"
  class="
    pointer-events-none
    fixed
    left-1/2
    top-5
    z-[300]
    hidden
    w-[calc(100%-2rem)]
    max-w-sm
    -translate-x-1/2
    rounded-2xl
    bg-slate-900
    px-4
    py-3
    text-center
    text-sm
    font-semibold
    text-white
    shadow-xl
  "
></div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
