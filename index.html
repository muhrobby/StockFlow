<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    Warehouse Scanner
  </title>


  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>


  <!-- Barcode Scanner -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <!-- Lucide -->
  <script
    src="https://unpkg.com/lucide@latest"
  ></script>


  <style>

    html,
    body {

      min-height: 100%;

      background: #020617;

    }


    body {

      margin: 0;

      -webkit-tap-highlight-color:
        transparent;

      overscroll-behavior:
        none;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 24px;

      background: #000;

    }


    #reader video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover !important;

      border-radius: 24px;

    }


    #reader__scan_region {

      background:
        transparent !important;

    }


    #reader__dashboard {

      display:
        none !important;

    }


    #reader img {

      display:
        none !important;

    }


    .scan-line {

      animation:
        scanning
        2s
        ease-in-out
        infinite;

    }


    @keyframes scanning {

      0% {

        top: 25%;

      }

      50% {

        top: 70%;

      }

      100% {

        top: 25%;

      }

    }


    .safe-bottom {

      padding-bottom:
        max(
          20px,
          env(
            safe-area-inset-bottom
          )
        );

    }

  </style>

</head>


<body

>

        <div

        <div

        <!-- TARGET -->

        <div

            absolute

        >

              -top-0.5

              border-l-4
              border-t-4

            "
          ></div>


          <div
            class="
              absolute
              -right-0.5
              -top-0.5
              h-10
              w-10
              rounded-tr-2xl
              border-r-4
              border-t-4
              border-red-500
            "
          ></div>


          <div
            class="
              absolute
              -bottom-0.5
              -left-0.5
              h-10
              w-10
              rounded-bl-2xl
              border-b-4
              border-l-4
              border-red-500
            "
          ></div>


          <div
            class="
              absolute
              -bottom-0.5
              -right-0.5
              h-10
              w-10
              rounded-br-2xl
              border-b-4
              border-r-4
              border-red-500
            "
          ></div>


          <div
            class="
              scan-line
              absolute
              left-4
              right-4
              h-0.5

      <!-- =====================================

      ====================================== -->

      <div
        id="startOverlay"
        class="
          absolute
          inset-0
          z-30
          flex
          items-center
          justify-center
          rounded-3xl
          bg-slate-950
        "
      >


        <div
          class="
            max-w-xs
            px-6
            text-center
          "
        >


          <div
            class="
              mx-auto
              mb-5
              flex
              h-16
              w-16
              items-center
              justify-center
              rounded-3xl
              bg-red-600
              text-white
            "
          >

            <i
              data-lucide="camera"
              class="h-8 w-8"
            ></i>

          </div>


          <h2
            class="
              text-xl
              font-bold
            "
          >
            Kamera Scanner

          <p

              mt-2

              text-slate-400
            "

            Arahkan barcode produk

          </p>


          <button

              mt-6

              h-14

      <!-- =====================================

        class="
          absolute
          inset-0
          z-40
          hidden
          items-center
          justify-center

          bg-slate-950/95
          p-6
        "
      >


        <div

            text-center
          "
        >


          <div

              mx-auto
              mb-5
              flex

              w-20

              bg-emerald-500

            "
          >

            <i

              class="h-10 w-10"
            ></i>

          </div>


          <p
            class="
              text-sm
              font-semibold
              text-emerald-400
            "
          >
            SKU TERBACA
          </p>


          <h2
            id="scanResult"
            class="
              mt-2
              break-all
              text-3xl
              font-black
              text-white
            "
          >
            -
          </h2>


          <div
            class="
              mx-auto
              mt-6
              flex
              items-center
              justify-center
              gap-2
              text-sm
              text-slate-400
            "
          >

            <div
              class="
                h-4
                w-4
                animate-spin

                border-slate-600

            ></div>

            Mencari barang...

      </div>

    </div>



    <!-- INSTRUCTION -->

    <div
      class="
        mx-auto
        mt-5
        w-full
        max-w-lg
        text-center
      "
    >

      <p
        class="
          font-semibold
        "
      >
        Arahkan barcode ke dalam kotak
      </p>


      <p
        class="
          mt-1
          text-sm
          text-slate-400
        "

        Scanner akan membaca SKU secara otomatis.
      </p>

  </section>


  <div

      safe-bottom

    "
  ></div>


</main>



<!-- =========================================
     TOAST
========================================= -->

<div
  id="toast"
  class="
    fixed
    left-1/2
    top-5
    z-[100]
    hidden
    w-[calc(100%-2rem)]
    max-w-sm
    -translate-x-1/2
    rounded-2xl
    bg-white
    px-4
    py-3
    text-center
    text-sm
    font-semibold
    text-slate-900
    shadow-xl
  "
></div>



<script>

/* =========================================
   STATE
========================================= */

const ScannerState = {

  scanner: null,

  running: false,

  detected: false,

  returnUrl: ''

};



/* =========================================
   INIT
========================================= */

document.addEventListener(
  'DOMContentLoaded',
  initScannerPage
);



function initScannerPage() {


  lucide.createIcons();


  const params =
    new URLSearchParams(
      window.location.search
    );


  ScannerState.returnUrl =
    params.get(
      'return'
    ) || '';


  document
    .getElementById(
      'startButton'
    )
    .addEventListener(
      'click',
      startScanner
    );


  document
    .getElementById(
      'backButton'
    )
    .addEventListener(
      'click',
      goBack
    );


  /*
   * Scanner memang boleh dibuka
   * langsung untuk testing,
   * tetapi untuk penggunaan Apps Script
   * return URL harus tersedia.
   */
  if (
    !ScannerState.returnUrl
  ) {

    console.warn(
      'Return URL tidak tersedia.'
    );

  }

}



/* =========================================
   START SCANNER
========================================= */

async function startScanner() {


  if (
    ScannerState.running
  ) {
    return;
  }


  const button =
    document.getElementById(
      'startButton'
    );


  button.disabled =
    true;


  button.innerHTML = `

    <div
      class="
        h-5
        w-5
        animate-spin
        rounded-full
        border-2
        border-white/40
        border-t-white
      "
    ></div>

    Membuka kamera...

  `;


  try {


    ScannerState.detected =
      false;


    if (
      !ScannerState.scanner
    ) {


      ScannerState.scanner =
        new Html5Qrcode(
          'reader'
        );

    }



    /*
     * Prioritas kamera belakang.
     */
    try {


      await ScannerState.scanner.start(

        {

          facingMode: {

            exact:
              'environment'

          }

        },

        {

          fps: 15,


          qrbox:
            calculateScanBox,


          aspectRatio:
            1.333333,


          disableFlip:
            false

        },

        onScanSuccess,

        onScanFailure

      );


    } catch (
      exactError
    ) {


      console.warn(
        'Exact camera fallback:',
        exactError
      );


      /*
       * Fallback untuk HP yang
       * tidak support exact environment.
       */
      await ScannerState.scanner.start(

        {

          facingMode:
            'environment'

        },

        {

          fps: 15,


          qrbox:
            calculateScanBox,


          disableFlip:
            false

        },

        onScanSuccess,

        onScanFailure

      );

    }



    ScannerState.running =
      true;


    document
      .getElementById(
        'startOverlay'
      )
      .classList.add(
        'hidden'
      );


    setCameraStatus(
      true,
      'Scanner aktif'
    );


  } catch (error) {


    console.error(
      'Camera error:',
      error
    );


    setCameraStatus(
      false,
      'Kamera gagal'
    );


    showToast(
      'Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.'
    );


  } finally {


    button.disabled =
      false;


    button.innerHTML = `

      <i
        data-lucide="scan-barcode"
        class="h-5 w-5"
      ></i>

      Mulai Scanner

    `;


    lucide.createIcons();

  }

}



/* =========================================
   SCAN AREA
========================================= */

function calculateScanBox(
  viewfinderWidth,
  viewfinderHeight
) {


  const width =
    Math.floor(
      viewfinderWidth * 0.82
    );


  const calculatedHeight =
    Math.floor(
      width * 0.42
    );


  const maxHeight =
    Math.floor(
      viewfinderHeight * 0.42
    );


  return {

    width,

    height:
      Math.min(
        calculatedHeight,
        maxHeight
      )

  };

}



/* =========================================
   SCAN SUCCESS
========================================= */

async function onScanSuccess(
  decodedText,
  decodedResult
) {


  if (
    ScannerState.detected
  ) {

    return;

  }


  const sku =
    String(
      decodedText ||
      ''
    )
      .trim()
      .replace(
        /[\r\n\t]/g,
        ''
      );


  if (!sku) {

    return;

  }


  ScannerState.detected =
    true;



  /*
   * Feedback HP.
   */
  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }



  /*
   * Camera stop.
   */
  await stopScanner();



  /*
   * Success UI.
   */
  document
    .getElementById(
      'scanResult'
    )
    .textContent =
      sku;


  const successOverlay =
    document.getElementById(
      'successOverlay'
    );


  successOverlay
    .classList
    .remove(
      'hidden'
    );


  successOverlay
    .classList
    .add(
      'flex'
    );


  setCameraStatus(
    false,
    'Berhasil'
  );


  lucide.createIcons();



  /*
   * Jika scanner dibuka dari
   * Apps Script, redirect kembali.
   */
  if (
    ScannerState.returnUrl
  ) {


    setTimeout(
      () => {


        redirectToApp(
          sku
        );


      },
      450
    );


  } else {


    showToast(
      `SKU terbaca: ${sku}`
    );

  }

}



/* =========================================
   REDIRECT
========================================= */

function redirectToApp(
  sku
) {


  const returnUrl =
    ScannerState.returnUrl;


  if (!returnUrl) {

    return;

  }


  /*
   * Aman jika return URL suatu hari
   * sudah mempunyai query parameter.
   */
  const separator =
    returnUrl.includes('?')
      ? '&'
      : '?';


  const url =
    returnUrl +
    separator +
    'sku=' +
    encodeURIComponent(
      sku
    );


  window.location.href =
    url;

}



/* =========================================
   SCAN FAILURE
========================================= */

function onScanFailure(
  error
) {


  /*
   * Sengaja kosong.
   *
   * Fungsi ini bisa terpanggil
   * berkali-kali per detik.
   *
   * Jangan console.log untuk menjaga
   * performa mobile.
   */

}



/* =========================================
   STOP
========================================= */

async function stopScanner() {


  if (
    !ScannerState.scanner ||
    !ScannerState.running
  ) {

    return;

  }


  try {


    await ScannerState
      .scanner
      .stop();


  } catch (error) {


    console.warn(
      'Stop scanner:',
      error
    );


  } finally {


    ScannerState.running =
      false;

  }

}



/* =========================================
   BACK
========================================= */

async function goBack() {


  await stopScanner();


  if (
    ScannerState.returnUrl
  ) {


    window.location.href =
      ScannerState.returnUrl;


    return;

  }


  if (
    window.history.length > 1
  ) {


    window.history.back();


  } else {


    window.location.href =
      'https://muhrobby.github.io/warehouse-scanner/';

  }

}



/* =========================================
   STATUS
========================================= */

function setCameraStatus(
  active,
  text
) {


  const dot =
    document.getElementById(
      'statusDot'
    );


  const status =
    document.getElementById(
      'statusText'
    );


  status.textContent =
    text;


  dot.className =
    active
      ? 'h-2 w-2 rounded-full bg-emerald-400'
      : 'h-2 w-2 rounded-full bg-amber-400';

}



/* =========================================
   TOAST
========================================= */

function showToast(
  message
) {


  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.classList.remove(
    'hidden'
  );


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      () => {


        toast.classList.add(
          'hidden'
        );


      },
      2500
    );

}



/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
  'beforeunload',
  () => {


    if (
      ScannerState.scanner &&
      ScannerState.running
    ) {


      ScannerState
        .scanner
        .stop()
        .catch(
          () => {}
        );

    }

  }
);

</script>


</body>

</html>
